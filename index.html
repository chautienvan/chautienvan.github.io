<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - GitHub Pages</title>
    <style>
        /* Bạn có thể thêm CSS của bạn vào đây để giống với file PHP cũ */
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .login-container { border: 1px solid #ccc; padding: 20px; border-radius: 5px; width: 300px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        .error { color: red; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Đăng nhập</h2>
    <div id="error-message" class="error"></div>
    
    <label for="username">Tên đăng nhập:</label>
    <input type="text" id="username" placeholder="Nhập admin">
    
    <label for="password">Mật khẩu:</label>
    <input type="password" id="password" placeholder="Nhập 123">
    
    <button onclick="handleLogin()">Đăng nhập</button>
</div>

<script>
    // Thông tin mặc định (Giống trong file image_52b5bb.png của bạn)
    const VALID_USER = "admin";
    const VALID_PASS = "123";

    // Kiểm tra nếu đã đăng nhập trước đó (thay cho Session/Cookie của PHP)
    window.onload = function() {
        if (localStorage.getItem('user_logged_in') === 'true') {
            window.location.href = "baitap07-02.html"; // Chuyển hướng nếu đã login
        }
    };

    function handleLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');

        if (user === VALID_USER && pass === VALID_PASS) {
            // Lưu trạng thái đăng nhập vào LocalStorage (thay cho Cookie)
            localStorage.setItem('user_logged_in', 'true');
            alert("Đăng nhập thành công!");
            window.location.href = "baitap07-02.html"; 
        } else {
            errorDiv.innerText = "Sai tên đăng nhập hoặc mật khẩu!";
        }
    }
</script>

</body>
</html>
